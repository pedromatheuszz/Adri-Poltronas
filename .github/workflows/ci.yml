name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    # A aplicacao e Windows-only (DPAPI via pywin32, instalador NSIS).
    # Rodar em ubuntu escondia o caminho de codigo que realmente vai a producao.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: backend/requirements.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Lint with ruff
      run: ruff check backend/ tests/ build.py

    - name: Run tests with coverage
      working-directory: backend
      run: >-
        python -m pytest ../tests -v --tb=short
        --cov=. --cov-report=term-missing --cov-report=xml:../coverage.xml

    - name: Upload coverage reports
      if: matrix.python-version == '3.12'
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
      continue-on-error: true

  electron:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install Node dependencies
      run: npm ci

    - name: Typecheck (tsc --noEmit)
      run: npm run typecheck

    - name: Build main process
      run: npm run build

  qt:
    # A janela Qt e uma interface alternativa a do Electron, sobre o mesmo
    # backend. Compilar e rodar o ctest no CI evita que ela apodreca calada.
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.3'
        arch: 'win64_mingw'
        tools: 'tools_mingw1310'
        cache: true

    - name: Configure, build and test
      working-directory: qt-app
      run: |
        cmake -G "MinGW Makefiles" -S . -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build -j 4
        ctest --test-dir build --output-on-failure

  dotnet:
    # A solution .NET/Avalonia e multiplataforma; o CI compila no Linux para
    # que uma dependencia acidental de Windows apareca aqui, e nao na primeira
    # tentativa de publicar para outro sistema.
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore
      working-directory: dotnet
      run: dotnet restore

    - name: Build
      working-directory: dotnet
      run: dotnet build --no-restore --configuration Release

    - name: Test
      working-directory: dotnet
      run: dotnet test --no-build --configuration Release --verbosity normal

  security:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        # Historico completo: a varredura de segredos precisa olhar TODOS os
        # commits, nao so o ultimo. Com o clone raso padrao (depth 1) o
        # gitleaks nao consegue resolver o intervalo e o passo reprovava.
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install audit tools
      run: |
        python -m pip install --upgrade pip
        pip install pip-audit

    - name: Check for vulnerable dependencies
      # Sem `|| true`: uma dependencia vulneravel precisa reprovar o pipeline.
      run: pip-audit --requirement backend/requirements.txt --strict

    # gitleaks pelo binario, e nao pela action oficial.
    #
    # A `gitleaks/gitleaks-action@v2` reprovava com "Unexpected exit code [1]"
    # sem apontar nenhum vazamento -- e o proprio gitleaks, rodado sobre este
    # repositorio, responde "no leaks found". O que falhava era a camada da
    # action (validacao de licenca e telemetria), nao a varredura.
    #
    # Chamar o binario direto tira essa camada do caminho: a versao fica
    # fixada, o resultado e reproduzivel localmente com o mesmo comando, e o
    # passo faz exatamente o que o nome dele diz.
    - name: Scan for committed secrets
      env:
        VERSAO_GITLEAKS: 8.30.1
      run: |
        curl -sSfL -o gitleaks.tar.gz \
          "https://github.com/gitleaks/gitleaks/releases/download/v${VERSAO_GITLEAKS}/gitleaks_${VERSAO_GITLEAKS}_linux_x64.tar.gz"
        tar -xzf gitleaks.tar.gz gitleaks
        chmod +x gitleaks
        # `--redact` para o log do CI nunca imprimir o segredo encontrado --
        # o log e publico neste repositorio.
        ./gitleaks detect --source . --no-banner --redact --verbose
        rm -f gitleaks gitleaks.tar.gz

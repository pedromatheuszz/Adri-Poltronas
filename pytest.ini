[pytest]
# `backup/` guarda uma copia integral do backend v1 com a suite dele junto.
# Sem esta exclusao, um `pytest` sem argumentos coletaria a suite duas vezes e
# a copia arquivada passaria a "falhar" a cada mudanca feita no original.
norecursedirs = backup dist dist-electron dist-instalador build node_modules .git *.egg-info

# As duas suites convivem: o v2 e um pacote (backend_v2.*), entao nenhum modulo
# de topo dele disputa nome com o v1.
testpaths = tests tests_v2
